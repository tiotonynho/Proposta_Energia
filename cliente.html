<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pórtico · Sua proposta e contrato</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme-portico.css"><link rel="stylesheet" href="contracts.css"></head>
<body class="customer-page"><main style="margin:0;max-width:960px;padding:24px;margin-inline:auto"><div class="panel"><span class="section-kicker">PÓRTICO SOLAR ENERGY</span><h1>Sua proposta e contrato</h1><p id="publicStatus" role="status">Carregando…</p><div id="publicSummary"></div><article id="publicContract" class="public-contract" hidden></article>
<form id="publicForm" hidden><h2 id="publicAction"></h2><div class="form-grid"><label>Nome completo<input name="name" required maxlength="250"></label><label>CPF / CNPJ do contratante<input name="document" required maxlength="250"></label><label class="wide">E-mail<input name="email" type="email" required maxlength="250"></label></div>
<label class="check-label"><input type="checkbox" name="confirmed" required><span id="publicConsent"></span></label><p class="field-help">Assinatura simples por link, com identidade autodeclarada. Registraremos os dados informados, data, endereço IP e versão do documento para documentar esta operação.</p><button class="primary" id="publicSubmit">Confirmar</button></form><p id="publicMessage" role="status"></p><button class="ghost" id="publicPrint" hidden>Imprimir / Salvar comprovante</button></div></main><script src="cliente.js"></script></body></html>
